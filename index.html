
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorir Sensual — Pintar por Números</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#201522;color:#fff;font-family:Arial,sans-serif;text-align:center}
header{padding:18px 10px;background:#38213b}
h1{margin:0;color:#ffb5dc;font-size:25px}
main{max-width:900px;margin:auto;padding:14px}
p{font-size:14px;line-height:1.5;color:#eaddea}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
button,.upload,select{border:0;border-radius:10px;padding:11px 13px;background:#a94483;color:white;font-size:14px;cursor:pointer}
input[type=file]{display:none}
select option{background:#38213b}
#palette{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:15px 0}
.swatch{width:60px;padding:5px!important;background:#38213b!important;border:2px solid transparent}
.swatch.active{border-color:#fff}
.chip{height:29px;border-radius:5px;border:1px solid #ffffff55}
.num{font-size:13px;font-weight:bold;margin-top:4px}
#view{background:#fff;border-radius:10px;overflow:auto;max-height:78vh}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
#status{min-height:36px}
small{color:#d9c9dc}
</style>
</head>
<body>
<header>
<h1>💗 Colorir Sensual</h1>
<p>Transforme suas fotos em desenhos numerados!</p>
</header>
<main>
<div class="tools">
<label class="upload" for="file">🖼️ Abrir imagem</label>
<input id="file" type="file" accept="image/*">
<label>Quantidade
<select id="quality">
<option value="6">6 cores</option>
<option value="10">10 cores</option>
<option value="15" selected>15 cores</option>
<option value="20">20 cores</option>
<option value="30">30 cores</option>
<option value="40">40 cores</option>
</select>
</label>
<button id="generate">✨ Gerar desenho</button>
<button id="undo">↩ Desfazer</button>
<button id="reset">Limpar pintura</button>
<button id="save">⬇ Salvar</button>
</div>
<p id="status">Abra uma foto para começar.</p>
<div id="palette"></div>
<div id="view"><canvas id="canvas" width="600" height="800"></canvas></div>
<p><small>Selecione um número e clique na região correspondente. Os contornos são mantidos ao pintar.</small></p>
</main>

<script>
const canvas=document.querySelector('#canvas');
const ctx=canvas.getContext('2d');
const file=document.querySelector('#file');
const status=document.querySelector('#status');
const paletteEl=document.querySelector('#palette');
const quality=document.querySelector('#quality');

let source=null,W=600,H=800;
let gw=0,gh=0,labels=null,regionColors=[],painted=[];
let selected=0,history=[],edges=null,components=[];

function say(s){status.textContent=s}

function placeholder(){
 canvas.width=600;canvas.height=800;
 ctx.fillStyle='#fff';ctx.fillRect(0,0,600,800);
 ctx.fillStyle='#555';ctx.textAlign='center';
 ctx.font='20px Arial';ctx.fillText('Sua imagem aparecerá aqui',300,380);
 ctx.font='15px Arial';ctx.fillText('Clique em Abrir imagem',300,415);
}
placeholder();

file.onchange=()=>{
 const f=file.files[0];if(!f)return;
 if(!f.type.startsWith('image/')){say('Escolha um arquivo de imagem.');return}
 const url=URL.createObjectURL(f),img=new Image();
 img.onload=()=>{
  const scale=Math.min(1000/img.width,1400/img.height,1);
  W=Math.max(1,Math.round(img.width*scale));
  H=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const cc=c.getContext('2d',{willReadFrequently:true});
  cc.fillStyle='#fff';cc.fillRect(0,0,W,H);cc.drawImage(img,0,0,W,H);
  source=cc.getImageData(0,0,W,H);
  URL.revokeObjectURL(url);
  makeDrawing();
 };
 img.onerror=()=>{URL.revokeObjectURL(url);say('Não foi possível abrir a imagem.')};
 img.src=url;
};

document.querySelector('#generate').onclick=()=>{
 if(!source){say('Abra uma imagem primeiro.');return}
 makeDrawing();
};

function dist(a,b){
 const r=a[0]-b[0],g=a[1]-b[1],bl=a[2]-b[2];
 return r*r+g*g+bl*bl;
}

function makeDrawing(){
 say('Analisando cores e criando contornos...');
 paletteEl.replaceChildren();
 history=[];

 // Grade mais detalhada e suavizada.
 const factor=Math.min(1,560/Math.max(W,H));
 gw=Math.max(1,Math.round(W*factor));
 gh=Math.max(1,Math.round(H*factor));

 const small=document.createElement('canvas');
 small.width=gw;small.height=gh;
 const sc=small.getContext('2d',{willReadFrequently:true});
 const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;
 tmp.getContext('2d').putImageData(source,0,0);
 sc.imageSmoothingEnabled=true;
 sc.imageSmoothingQuality='high';
 sc.drawImage(tmp,0,0,gw,gh);
 const pix=sc.getImageData(0,0,gw,gh).data;
 const n=gw*gh,k=Math.min(Number(quality.value),n);
 const points=new Array(n);

 for(let i=0;i<n;i++)points[i]=[pix[4*i],pix[4*i+1],pix[4*i+2]];

 // Inicialização das cores a partir de pontos distribuídos.
 let centers=[];
 for(let j=0;j<k;j++){
  const i=Math.min(n-1,Math.floor((j+.5)*n/k));
  centers.push(points[i].slice());
 }
 const ids=new Uint16Array(n);
 for(let it=0;it<9;it++){
  const sums=Array.from({length:k},()=>[0,0,0,0]);
  for(let i=0;i<n;i++){
   let best=0,bd=Infinity;
   for(let j=0;j<k;j++){
    const d=dist(points[i],centers[j]);
    if(d<bd){bd=d;best=j}
   }
   ids[i]=best;
   const s=sums[best];s[0]+=points[i][0];s[1]+=points[i][1];s[2]+=points[i][2];s[3]++;
  }
  for(let j=0;j<k;j++)if(sums[j][3]){
   centers[j]=[sums[j][0]/sums[j][3],sums[j][1]/sums[j][3],sums[j][2]/sums[j][3]];
  }
 }

 // Suavização moderada, preservando os contornos principais.
 let next=new Uint16Array(n);
 for(let pass=0;pass<2;pass++){
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
   const count=new Uint16Array(k);
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const xx=x+dx,yy=y+dy;
    if(xx>=0&&yy>=0&&xx<gw&&yy<gh)count[ids[yy*gw+xx]]++;
   }
   let best=ids[y*gw+x],max=0;
   for(let j=0;j<k;j++)if(count[j]>max){max=count[j];best=j}
   next[y*gw+x]=best;
  }
  ids.set(next);
 }

 const freq=new Array(k).fill(0);
 for(let i=0;i<n;i++)freq[ids[i]]++;
 const used=Array.from({length:k},(_,i)=>i).filter(i=>freq[i]>0).sort((a,b)=>freq[b]-freq[a]);
 const remap=new Uint16Array(k);
 regionColors=used.map((old,i)=>{remap[old]=i;return centers[old].map(Math.round)});
 labels=new Uint16Array(n);
 for(let i=0;i<n;i++)labels[i]=remap[ids[i]];
 painted=new Array(regionColors.length).fill(null);
 selected=0;

 // Limites entre regiões.
 edges=new Uint8Array(n);
 for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
  const p=y*gw+x;
  if(x+1<gw&&labels[p]!==labels[p+1]){edges[p]=1;edges[p+1]=1}
  if(y+1<gh&&labels[p]!==labels[p+gw]){edges[p]=1;edges[p+gw]=1}
 }

 findComponents();
 buildPalette();
 render();
 say('Pronto! Selecione um número e clique numa região.');
}

function findComponents(){
 components=[];
 const seen=new Uint8Array(labels.length);
 for(let i=0;i<labels.length;i++){
  if(seen[i])continue;
  const id=labels[i],stack=[i];seen[i]=1;
  let sumX=0,sumY=0,count=0;
  while(stack.length){
   const p=stack.pop(),x=p%gw,y=Math.floor(p/gw);
   sumX+=x;sumY+=y;count++;
   const ns=[];
   if(x>0)ns.push(p-1);
   if(x<gw-1)ns.push(p+1);
   if(y>0)ns.push(p-gw);
   if(y<gh-1)ns.push(p+gw);
   for(const q of ns)if(!seen[q]&&labels[q]===id){seen[q]=1;stack.push(q)}
  }
  if(count>=Math.max(8,gw*gh/5000)){
   components.push({id,x:sumX/count,y:sumY/count,size:count});
  }
 }
}

function buildPalette(){
 paletteEl.replaceChildren();
 regionColors.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='swatch'+(i===selected?' active':'');
  const chip=document.createElement('div');chip.className='chip';
  chip.style.background='#fff';
  const num=document.createElement('div');num.className='num';num.textContent=i+1;
  b.append(chip,num);
  b.title='Número '+(i+1);
  b.onclick=()=>{selected=i;buildPalette()};
  paletteEl.appendChild(b);
 });
}

function render(){
 if(!labels)return;
 canvas.width=W;canvas.height=H;
 const out=ctx.createImageData(W,H),d=out.data;
 const sx=gw/W,sy=gh/H;

 // Ampliação suave da máscara das regiões.
 for(let y=0;y<H;y++){
  const gy=Math.min(gh-1,Math.floor(y*sy));
  for(let x=0;x<W;x++){
   const gx=Math.min(gw-1,Math.floor(x*sx));
   const p=gy*gw+gx,id=labels[p],q=(y*W+x)*4;
   const boundary=edges[p]||
    (gx+1<gw&&labels[p]!==labels[p+1])||
    (gy+1<gh&&labels[p]!==labels[p+gw]);

   let c=painted[id];
   if(boundary){d[q]=25;d[q+1]=25;d[q+2]=25}
   else if(c){d[q]=c[0];d[q+1]=c[1];d[q+2]=c[2]}
   else{d[q]=255;d[q+1]=255;d[q+2]=255}
   d[q+3]=255;
  }
 }
 ctx.putImageData(out,0,0);
 drawNumbers();
}

function drawNumbers(){
 ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
 const placed=[];
 const minDist=Math.max(16,Math.min(30,gw/18));
 components.sort((a,b)=>b.size-a.size);
 for(const c of components){
  if(placed.some(p=>Math.hypot(p.x-c.x,p.y-c.y)<minDist))continue;
  const x=(c.x+.5)*W/gw,y=(c.y+.5)*H/gh;
  const text=String(c.id+1);
  const fs=Math.max(9,Math.min(16,Math.min(W,H)/48));
  ctx.font='bold '+fs+'px Arial';
  ctx.lineWidth=3;ctx.strokeStyle='white';ctx.fillStyle='#111';
  ctx.strokeText(text,x,y);ctx.fillText(text,x,y);
  placed.push({x:c.x,y:c.y});
 }
 ctx.restore();
}

canvas.onclick=e=>{
 if(!labels)return;
 const rect=canvas.getBoundingClientRect();
 const x=Math.max(0,Math.min(W-1,Math.floor((e.clientX-rect.left)*W/rect.width)));
 const y=Math.max(0,Math.min(H-1,Math.floor((e.clientY-rect.top)*H/rect.height)));
 const gx=Math.min(gw-1,Math.floor(x*gw/W));
 const gy=Math.min(gh-1,Math.floor(y*gh/H));
 const target=gy*gw+gx,id=labels[target];

 // Pinta somente o componente conectado tocado.
 const seen=new Uint8Array(labels.length),stack=[target];
 seen[target]=1;
 while(stack.length){
  const p=stack.pop(),px=p%gw,py=Math.floor(p/gw);
  const ns=[];
  if(px>0)ns.push(p-1);
  if(px<gw-1)ns.push(p+1);
  if(py>0)ns.push(p-gw);
  if(py<gh-1)ns.push(p+gw);
  for(const q of ns)if(!seen[q]&&labels[q]===id){seen[q]=1;stack.push(q)}
 }
 history.push(painted.slice());
 if(history.length>20)history.shift();
 painted[id]=regionColors[selected].slice();
 render();
 say('Região pintada com o número '+(selected+1)+'.');
};

document.querySelector('#undo').onclick=()=>{
 if(history.length){painted=history.pop();render();say('Última pintura desfeita.')}
 else say('Não há ações para desfazer.');
};

document.querySelector('#reset').onclick=()=>{
 if(!labels)return;
 history.push(painted.slice());
 painted.fill(null);render();say('Pintura reiniciada.');
};

document.querySelector('#save').onclick=()=>{
 if(!labels){say('Gere um desenho primeiro.');return}
 const a=document.createElement('a');
 a.download='desenho-numerado.png';
 a.href=canvas.toDataURL('image/png');a.click();
};
</script>
</body>
</html>
