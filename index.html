
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#201522">
<title>Colorir Sensual</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#201522;color:#fff;
font-family:Arial,sans-serif;text-align:center}
header{padding:18px 10px;background:#38213b}
h1{margin:0;color:#ffb5dc;font-size:25px}
p{color:#e6d8e7;font-size:14px}
main{max-width:650px;margin:auto;padding:14px}
button,.upload{border:0;border-radius:12px;padding:12px;
background:#a94483;color:white;font-size:15px;
cursor:pointer}
.tools{display:flex;flex-wrap:wrap;gap:9px;
justify-content:center;margin:14px 0}
#colors{display:flex;flex-wrap:wrap;gap:10px;
justify-content:center;margin:16px 0}
.swatch{width:35px;height:35px;border-radius:50%;
border:2px solid white;padding:0}
canvas{display:block;width:100%;height:auto;
background:white;border-radius:12px;touch-action:manipulation}
input[type=file]{display:none}
input[type=color]{width:42px;height:42px;border:0;
background:none;vertical-align:middle}
footer{padding:18px;color:#d8c8da;font-size:12px}
</style>
</head>
<body>
<header>
<h1>💗 Colorir Sensual</h1>
<p>Escolha um desenho, toque e dê vida às cores!</p>
</header>
<main>
<div class="tools">
<label class="upload" for="file">🖼️ Abrir desenho</label>
<input id="file" type="file" accept="image/*">
<button id="undo">↩ Desfazer</button>
<button id="clear">Limpar pintura</button>
<button id="save">⬇ Salvar imagem</button>
</div>

<div id="colors"></div>
<label>Cor personalizada:
<input id="custom" type="color" value="#ef5da8"></label>

<p id="status">Abra um desenho em preto e branco para começar.</p>
<canvas id="canvas" width="600" height="800"></canvas>
</main>
<footer>Seus desenhos são processados neste navegador.</footer>

<script>
const canvas=document.querySelector('#canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const file=document.querySelector('#file');
const status=document.querySelector('#status');
let color='#ef5da8';
let original=null;
let history=[];

const palette=[
'#ef5da8','#ff4040','#ff9f43','#ffe066',
'#72d572','#35c9b5','#4d96ff','#7856d6',
'#ffffff','#171717','#b97855','#e9c6a8'
];

const colors=document.querySelector('#colors');
palette.forEach(c=>{
 const b=document.createElement('button');
 b.className='swatch';
 b.style.background=c;
 b.setAttribute('aria-label','Escolher cor '+c);
 b.onclick=()=>color=c;
 colors.appendChild(b);
});

document.querySelector('#custom').oninput=e=>color=e.target.value;

function drawPlaceholder(){
 ctx.fillStyle='white';
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#555';
 ctx.textAlign='center';
 ctx.font='20px Arial';
 ctx.fillText('Seu desenho aparecerá aqui',300,380);
 ctx.font='15px Arial';
 ctx.fillText('Toque em “Abrir desenho”',300,415);
}
drawPlaceholder();

file.onchange=()=>{
 const f=file.files[0];
 if(!f)return;

 if(!f.type.startsWith('image/')){
   status.textContent='Escolha um arquivo de imagem.';
   return;
 }

 const img=new Image();

 img.onload=()=>{
   const scale=Math.min(900/img.width,1200/img.height,1);

   canvas.width=Math.round(img.width*scale);
   canvas.height=Math.round(img.height*scale);

   ctx.fillStyle='white';
   ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(img,0,0,canvas.width,canvas.height);

   original=ctx.getImageData(0,0,canvas.width,canvas.height);
   history=[];

   // Conta cores RGB exatas e agrupa tons semelhantes.
   const pixels=original.data;
   const coresExatas=new Set();
   const tonsAgrupados=new Set();
   const coresFrequentes=new Map();

   for(let i=0;i<pixels.length;i+=4){
     const r=pixels[i];
     const g=pixels[i+1];
     const b=pixels[i+2];
     const a=pixels[i+3];

     if(a===0)continue;

     // Cor exata: inclui pequenas diferenças entre pixels.
     const rgb=(r<<16)|(g<<8)|b;
     coresExatas.add(rgb);

     // Agrupa cores próximas em faixas de 8 níveis por canal.
     const qr=Math.floor(r/8);
     const qg=Math.floor(g/8);
     const qb=Math.floor(b/8);
     const grupo=(qr<<10)|(qg<<5)|qb;

     tonsAgrupados.add(grupo);
     coresFrequentes.set(grupo,(coresFrequentes.get(grupo)||0)+1);
   }

   const tonsPrincipais=[...coresFrequentes.entries()]
     .sort((a,b)=>b[1]-a[1])
     .slice(0,12);

   status.textContent=
     'Imagem analisada! Cores RGB diferentes: '+
     coresExatas.size.toLocaleString('pt-BR')+
     ' | Tons agrupados: '+
     tonsAgrupados.size.toLocaleString('pt-BR')+
     '.';

   // Mostra alguns dos tons mais frequentes.
   let painel=document.querySelector('#analise-cores');

   if(!painel){
     painel=document.createElement('div');
     painel.id='analise-cores';
     painel.style.cssText='margin:14px 0;padding:12px;background:#38213b;border-radius:12px;';
     colors.insertAdjacentElement('afterend',painel);
   }

   painel.innerHTML='<p><b>🎨 Tons mais encontrados na imagem</b></p>';

   const amostras=document.createElement('div');
   amostras.style.cssText='display:flex;flex-wrap:wrap;gap:8px;justify-content:center;';

   tonsPrincipais.forEach(([grupo,quantidade])=>{
     const r=((grupo>>10)&31)*8+4;
     const g=((grupo>>5)&31)*8+4;
     const b=(grupo&31)*8+4;

     const amostra=document.createElement('div');
     amostra.title='Pixels aproximados: '+quantidade.toLocaleString('pt-BR');
     amostra.style.cssText=
       'width:32px;height:32px;border-radius:7px;border:1px solid white;'+
       'background:rgb('+Math.min(r,255)+','+
       Math.min(g,255)+','+Math.min(b,255)+');';

     amostras.appendChild(amostra);
   });

   painel.appendChild(amostras);

   URL.revokeObjectURL(img.src);
 };

 img.onerror=()=>{
   status.textContent='Não foi possível abrir essa imagem.';
 };

 img.src=URL.createObjectURL(f);
};
 }
 const img=new Image();
 img.onload=()=>{
   const scale=Math.min(900/img.width,1200/img.height,1);
   canvas.width=Math.round(img.width*scale);
   canvas.height=Math.round(img.height*scale);
   ctx.fillStyle='white';
   ctx.fillRect(0,0,canvas.width,canvas.height);
   ctx.drawImage(img,0,0,canvas.width,canvas.height);
   original=ctx.getImageData(0,0,canvas.width,canvas.height);
   history=[];
   status.textContent='Desenho carregado! Escolha uma cor e toque numa região fechada.';
   URL.revokeObjectURL(img.src);
 };
 img.src=URL.createObjectURL(f);
};

function hexRGB(hex){
 return [
  parseInt(hex.slice(1,3),16),
  parseInt(hex.slice(3,5),16),
  parseInt(hex.slice(5,7),16)
 ];
}

canvas.onclick=e=>{
 if(!original){
  status.textContent='Primeiro, abra um desenho.';
  return;
 }

 const rect=canvas.getBoundingClientRect();
 const x=Math.floor((e.clientX-rect.left)*canvas.width/rect.width);
 const y=Math.floor((e.clientY-rect.top)*canvas.height/rect.height);
 const w=canvas.width,h=canvas.height;
 const img=ctx.getImageData(0,0,w,h);
 const d=img.data;
 const start=(y*w+x)*4;
 const sr=d[start],sg=d[start+1],sb=d[start+2];

 // Evita pintar linhas escuras.
 if((sr+sg+sb)/3<100){
  status.textContent='Toque dentro de uma área branca do desenho.';
  return;
 }

 history.push(ctx.getImageData(0,0,w,h));
 if(history.length>8)history.shift();

 const [r,g,b]=hexRGB(color);
 const visited=new Uint8Array(w*h);
 const stack=[y*w+x];
 const tolerance=48;
 let count=0;

 while(stack.length){
  const pos=stack.pop();
  if(pos<0||pos>=w*h||visited[pos])continue;
  visited[pos]=1;
  const i=pos*4;
  const dr=d[i]-sr,dg=d[i+1]-sg,db=d[i+2]-sb;

  if(dr*dr+dg*dg+db*db>tolerance*tolerance)continue;

  // Preserva linhas e sombras escuras.
  if((d[i]+d[i+1]+d[i+2])/3<100)continue;

  d[i]=r;d[i+1]=g;d[i+2]=b;
  count++;

  const px=pos%w;
  if(px>0)stack.push(pos-1);
  if(px<w-1)stack.push(pos+1);
  if(pos>=w)stack.push(pos-w);
  if(pos<w*(h-1))stack.push(pos+w);
 }

 ctx.putImageData(img,0,0);
 status.textContent=count>0
  ?'Área colorida! Escolha outra cor ou região.'
  :'Não foi possível pintar essa área.';
};

document.querySelector('#undo').onclick=()=>{
 if(history.length)ctx.putImageData(history.pop(),0,0);
 else status.textContent='Não há mais ações para desfazer.';
};

document.querySelector('#clear').onclick=()=>{
 if(original){
  history.push(ctx.getImageData(0,0,canvas.width,canvas.height));
  ctx.putImageData(original,0,0);
  status.textContent='Pintura reiniciada.';
 }
};

document.querySelector('#save').onclick=()=>{
 const a=document.createElement('a');
 a.download='meu-desenho-colorido.png';
 a.href=canvas.toDataURL('image/png');
 a.click();
};
</script>
</body>
</html>
