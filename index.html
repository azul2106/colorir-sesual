
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colorir Sensual — Pintura por Números</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#201522;color:white;font-family:Arial,sans-serif;text-align:center}
header{background:#38213b;padding:17px}
h1{margin:0;color:#ffb5dc;font-size:25px}
main{max-width:850px;margin:auto;padding:14px}
p{font-size:14px;line-height:1.5;color:#eaddea}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
button,.upload,select{
 border:0;border-radius:9px;padding:11px 13px;
 background:#a94483;color:white;font-size:14px;cursor:pointer
}
input[type=file]{display:none}
select option{background:#38213b}
#status{min-height:38px}
#palette{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:15px 0}
.swatch{width:58px;padding:5px!important;background:#38213b!important;border:2px solid transparent}
.swatch.active{border-color:white}
.chip{height:29px;border-radius:5px;border:1px solid #ffffff55}
.num{font-size:13px;font-weight:bold;margin-top:4px}
#view{background:white;border-radius:10px;overflow:auto;max-height:75vh}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
small{color:#d9c9dc}
</style>
</head>
<body>
<header>
<h1>💗 Colorir Sensual</h1>
<p>Transforme fotos em desenhos numerados para colorir!</p>
</header>

<main>
<div class="tools">
<label class="upload" for="file">🖼️ Escolher foto</label>
<input id="file" type="file" accept="image/*">
<label>Detalhes
<select id="quality">
<option value="6">6 cores</option>
<option value="10">10 cores</option>
<option value="15" selected>15 cores</option>
<option value="20">20 cores</option>
<option value="30">30 cores</option>
<option value="40">40 cores</option>
</select>
</label>
<button id="generate">✨ Gerar desenho</button>
<button id="undo">↩ Desfazer</button>
<button id="reset">Reiniciar</button>
<button id="save">⬇ Salvar</button>
</div>

<p id="status">Escolha uma foto para começar.</p>
<div id="palette"></div>
<div id="view">
<canvas id="canvas" width="600" height="800"></canvas>
</div>
<p><small>Selecione um número na paleta e clique na região correspondente. Regiões pequenas podem não exibir número para evitar sobreposição.</small></p>
</main>

<script>
const canvas=document.querySelector('#canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const file=document.querySelector('#file');
const status=document.querySelector('#status');
const paletteEl=document.querySelector('#palette');
const quality=document.querySelector('#quality');

let source=null, labels=null, painted=null;
let regionColors=[], selected=0, history=[];
let W=600,H=800, gridW=0,gridH=0,cellW=1,cellH=1;
let lineImage=null, originalImage=null;

function setStatus(s){status.textContent=s}

function rgbHex(c){
 return '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}

function colorDistance(a,b){
 const dr=a[0]-b[0],dg=a[1]-b[1],db=a[2]-b[2];
 return dr*dr+dg*dg+db*db;
}

function drawPlaceholder(){
 canvas.width=600;canvas.height=800;
 ctx.fillStyle='white';ctx.fillRect(0,0,600,800);
 ctx.fillStyle='#555';ctx.textAlign='center';
 ctx.font='20px Arial';ctx.fillText('Sua foto aparecerá aqui',300,380);
 ctx.font='15px Arial';ctx.fillText('Escolha uma foto acima',300,415);
}
drawPlaceholder();

file.onchange=()=>{
 const f=file.files[0];
 if(!f)return;
 if(!f.type.startsWith('image/')){setStatus('Escolha uma imagem válida.');return}
 const url=URL.createObjectURL(f);
 const img=new Image();
 img.onload=()=>{
  const scale=Math.min(720/img.width,1000/img.height,1);
  W=Math.max(1,Math.round(img.width*scale));
  H=Math.max(1,Math.round(img.height*scale));
  const off=document.createElement('canvas');
  off.width=W;off.height=H;
  const oc=off.getContext('2d',{willReadFrequently:true});
  oc.fillStyle='white';oc.fillRect(0,0,W,H);
  oc.drawImage(img,0,0,W,H);
  source=oc.getImageData(0,0,W,H);
  originalImage=source;
  URL.revokeObjectURL(url);
  generate();
 };
 img.onerror=()=>{URL.revokeObjectURL(url);setStatus('Não foi possível abrir a foto.')};
 img.src=url;
};

document.querySelector('#generate').onclick=()=>{
 if(!source){setStatus('Escolha uma foto primeiro.');return}
 generate();
};

function generate(){
 if(!source)return;
 setStatus('Criando regiões e suavizando os contornos...');
 paletteEl.replaceChildren();
 history=[];

 // Grade interna reduzida: suaviza ruído e evita regiões minúsculas.
 const factor=Math.min(1,230/Math.max(W,H));
 gridW=Math.max(30,Math.round(W*factor));
 gridH=Math.max(30,Math.round(H*factor));
 cellW=W/gridW;cellH=H/gridH;

 const small=document.createElement('canvas');
 small.width=gridW;small.height=gridH;
 const sc=small.getContext('2d',{willReadFrequently:true});
 sc.drawImage(source?imageFromData(source):small,0,0,gridW,gridH);
 const data=sc.getImageData(0,0,gridW,gridH).data;
 const n=gridW*gridH;
 const pixels=new Array(n);

 for(let i=0;i<n;i++){
  pixels[i]=[data[i*4],data[i*4+1],data[i*4+2]];
 }

 const k=Math.min(Number(quality.value),n);
 const centers=[];
 // Inicialização distribuída pela imagem.
 for(let j=0;j<k;j++){
  const idx=Math.min(n-1,Math.floor((j+.5)*n/k));
  centers.push(pixels[idx].slice());
 }

 const assign=new Int16Array(n);
 // Agrupamento k-means de cores.
 for(let iter=0;iter<8;iter++){
  const sums=Array.from({length:k},()=>[0,0,0,0]);
  for(let i=0;i<n;i++){
   let best=0,bd=Infinity;
   for(let j=0;j<k;j++){
    const d=colorDistance(pixels[i],centers[j]);
    if(d<bd){bd=d;best=j}
   }
   assign[i]=best;
   const s=sums[best];s[0]+=pixels[i][0];s[1]+=pixels[i][1];s[2]+=pixels[i][2];s[3]++;
  }
  for(let j=0;j<k;j++){
   if(sums[j][3]){
    centers[j]=[
     sums[j][0]/sums[j][3],
     sums[j][1]/sums[j][3],
     sums[j][2]/sums[j][3]
    ];
   }
  }
 }

 // Suavização de pequenas manchas com votação dos vizinhos.
 let temp=new Int16Array(n);
 for(let pass=0;pass<2;pass++){
  for(let y=0;y<gridH;y++){
   for(let x=0;x<gridW;x++){
    const counts=new Int16Array(k);
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
     const xx=x+dx,yy=y+dy;
     if(xx>=0&&yy>=0&&xx<gridW&&yy<gridH)
      counts[assign[yy*gridW+xx]]++;
    }
    let best=assign[y*gridW+x],max=-1;
    for(let j=0;j<k;j++)if(counts[j]>max){max=counts[j];best=j}
    temp[y*gridW+x]=best;
   }
  }
  assign.set(temp);
 }

 // Remove categorias vazias e ordena as cores por frequência.
 const freq=new Array(k).fill(0);
 for(let i=0;i<n;i++)freq[assign[i]]++;
 const used=[];
 for(let j=0;j<k;j++)if(freq[j]>0)used.push(j);
 used.sort((a,b)=>freq[b]-freq[a]);

 const remap=new Int16Array(k);
 regionColors=used.map((j,i)=>{
  remap[j]=i;
  return centers[j].map(v=>Math.round(v));
 });
 labels=new Uint16Array(n);
 for(let i=0;i<n;i++)labels[i]=remap[assign[i]];
 painted=new Array(regionColors.length).fill(null);
 selected=0;

 // Identifica contornos entre regiões.
 const edge=new Uint8Array(n);
 for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
  const p=y*gridW+x;
  if(x+1<gridW&&labels[p]!==labels[p+1]){edge[p]=1;edge[p+1]=1}
  if(y+1<gridH&&labels[p]!==labels[p+gridW]){edge[p]=1;edge[p+gridW]=1}
 }

 // Desenha em resolução final com antialiasing dos contornos.
 const work=document.createElement('canvas');
 work.width=W;work.height=H;
 const wc=work.getContext('2d');
 wc.fillStyle='white';wc.fillRect(0,0,W,H);

 const regionCanvas=document.createElement('canvas');
 regionCanvas.width=gridW;regionCanvas.height=gridH;
 const rc=regionCanvas.getContext('2d');
 const im=rc.createImageData(gridW,gridH);
 for(let i=0;i<n;i++){
  const p=i*4;
  if(edge[i]){
   im.data[p]=20;im.data[p+1]=20;im.data[p+2]=20;
  }else{
   im.data[p]=255;im.data[p+1]=255;im.data[p+2]=255;
  }
  im.data[p+3]=255;
 }
 rc.putImageData(im,0,0);
 wc.imageSmoothingEnabled=true;
 wc.drawImage(regionCanvas,0,0,W,H);

 lineImage=wc.getImageData(0,0,W,H);
 render();
 buildPalette();
 setStatus('Desenho pronto! Escolha um número e clique numa região.');
}

function imageFromData(data){
 const c=document.createElement('canvas');
 c.width=data.width;c.height=data.height;
 c.getContext('2d').putImageData(data,0,0);
 return c;
}

function buildPalette(){
 paletteEl.replaceChildren();
 regionColors.forEach((c,i)=>{
  const b=document.createElement('button');
  b.className='swatch'+(i===selected?' active':'');
  b.innerHTML='<div class="chip"></div><div class="num">'+(i+1)+'</div>';
  b.querySelector('.chip').style.background=rgbHex(c);
  b.title='Número '+(i+1);
  b.onclick=()=>{selected=i;buildPalette()};
  paletteEl.appendChild(b);
 });
}

function render(){
 if(!labels||!lineImage)return;
 canvas.width=W;canvas.height=H;
 const out=ctx.createImageData(W,H);
 const d=out.data,lines=lineImage.data;
 // Expande a região até o tamanho original.
 for(let y=0;y<H;y++){
  const gy=Math.min(gridH-1,Math.floor(y/gridH*gridH/(H/H)));
  for(let x=0;x<W;x++){
   const gx=Math.min(gridW-1,Math.floor(x/W*gridW));
   const id=labels[gy*gridW+gx];
   const p=(y*W+x)*4;
   const line=(lines[p]+lines[p+1]+lines[p+2])<300;
   let c=painted[id];
   if(line){d[p]=25;d[p+1]=25;d[p+2]=25}
   else if(c){d[p]=c[0];d[p+1]=c[1];d[p+2]=c[2]}
   else{d[p]=255;d[p+1]=255;d[p+2]=255}
   d[p+3]=255;
  }
 }
 ctx.putImageData(out,0,0);
 drawNumbers();
}

function drawNumbers(){
 if(!labels)return;
 ctx.save();
 ctx.textAlign='center';ctx.textBaseline='middle';
 // Calcula regiões conectadas para posicionar números sem empilhar.
 const visited=new Uint8Array(labels.length);
 const components=[];
 for(let i=0;i<labels.length;i++){
  if(visited[i])continue;
  const id=labels[i],stack=[i],cells=[];
  visited[i]=1;
  while(stack.length){
   const p=stack.pop();cells.push(p);
   const x=p%gridW,y=Math.floor(p/gridW);
   const ns=[];
   if(x>0)ns.push(p-1);
   if(x<gridW-1)ns.push(p+1);
   if(y>0)ns.push(p-gridW);
   if(y<gridH-1)ns.push(p+gridW);
   for(const q of ns)if(!visited[q]&&labels[q]===id){visited[q]=1;stack.push(q)}
  }
  if(cells.length>=Math.max(10,gridW*gridH/2500)){
   let sx=0,sy=0;
   for(const p of cells){sx+=p%gridW;sy+=Math.floor(p/gridW)}
   components.push({id,cells, x:sx/cells.length,y:sy/cells.length,size:cells.length});
  }
 }
 // Regiões grandes primeiro; não colocar vários números quase no mesmo lugar.
 components.sort((a,b)=>b.size-a.size);
 const placed=[];
 const minDist=Math.max(11,Math.min(24,gridW/18));
 for(const c of components){
  if(placed.some(p=>Math.hypot(p.x-c.x,p.y-c.y)<minDist))continue;
  const x=c.x*W/gridW,y=c.y*H/gridH;
  const num=String(c.id+1);
  const fs=Math.max(9,Math.min(16,Math.min(W,H)/45));
  ctx.font='bold '+fs+'px Arial';
  ctx.lineWidth=2.5;ctx.strokeStyle='white';ctx.fillStyle='#111';
  ctx.strokeText(num,x,y);
  ctx.fillText(num,x,y);
  placed.push(c);
 }
 ctx.restore();
}

canvas.onclick=e=>{
 if(!labels)return;
 const rect=canvas.getBoundingClientRect();
 const x=Math.floor((e.clientX-rect.left)*W/rect.width);
 const y=Math.floor((e.clientY-rect.top)*H/rect.height);
 const gx=Math.min(gridW-1,Math.floor(x/W*gridW));
 const gy=Math.min(gridH-1,Math.floor(y/H*gridH));
 const target=gy*gridW+gx;
 const id=labels[target];

 // Só pinta a região conectada tocada.
 const visited=new Uint8Array(labels.length);
 const stack=[target],cells=[];
 visited[target]=1;
 while(stack.length){
  const p=stack.pop();cells.push(p);
  const px=p%gridW,py=Math.floor(p/gridW);
  const ns=[];
  if(px>0)ns.push(p-1);
  if(px<gridW-1)ns.push(p+1);
  if(py>0)ns.push(p-gridW);
  if(py<gridH-1)ns.push(p+gridW);
  for(const q of ns)if(!visited[q]&&labels[q]===id){
   visited[q]=1;stack.push(q);
  }
 }
 history.push(painted.slice());
 if(history.length>20)history.shift();
 painted[id]=regionColors[selected].slice();
 render();
 setStatus('Região pintada. Cor selecionada: número '+(selected+1)+'.');
};

document.querySelector('#undo').onclick=()=>{
 if(history.length){painted=history.pop();render();setStatus('Última pintura desfeita.')}
 else setStatus('Não há ações para desfazer.');
};

document.querySelector('#reset').onclick=()=>{
 if(!labels)return;
 history.push(painted.slice());
 painted.fill(null);
 render();
 setStatus('Pintura reiniciada.');
};

document.querySelector('#save').onclick=()=>{
 if(!labels){setStatus('Gere um desenho primeiro.');return}
 const a=document.createElement('a');
 a.download='desenho-numerado.png';
 a.href=canvas.toDataURL('image/png');
 a.click();
};
</script>
</body>
</html>
